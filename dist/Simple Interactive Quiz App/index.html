<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interactive Quiz App</title>
    <link rel="stylesheet" href="../../src/output.css">
</head>
<body class=" font-serif min-h-screen flex flex-col">

    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-4 bg-blue-600 shadow-md">
        <div class="flex items-center gap-3">
            <img src="../assests/quizicon.png" alt="logo" class="w-10 h-10 object-contain">
            <h1 class="font-bold text-white text-xl tracking-wide">Quiz App</h1>
        </div>
    </header>
    <!-- Main Content Area -->
    <main class="flex-1 flex items-center justify-center p-4">
        
        <!-- Question Container -->
        <div id="question-container" class="w-full max-w-lg bg-white rounded-2xl shadow-2xl p-6 md:p-8 flex flex-col transition-all">
            <!-- JavaScript dynamically injects content here -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
