<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../src/output.css">
    <title>Interactive To-Do List App</title>
</head>

<body class="font-serif">
    <header>
        <section class="h-screen w-full flex flex-col bg-gray-900 ">

            <nav class="bg-gray-400 flex justify-between items-center p-3 px-10">
                <h2 class="text-xl"><i class="font-extrabold tracking-widest">onday</i></h2>
                <ul class="flex gap-8 font-bold">
                    <li class='cursor-pointer '>Support </li>
                    <li class='cursor-pointer'>Aboutus </li>
                    <li class='cursor-pointer'>FAQ</li>
                    <li class='cursor-pointer'>Blog</li>
                    <button class="bg-black text-white font-bold px-2 py-1 rounded-lg">Donate</button>
                </ul>
            </nav>

            <div class="h-[calc(100vh-60px)] w-full relative">
                <!-- Background Image -->
                <img src="../assests/hero1.jpg" alt="" class="absolute w-full h-full object-cover opacity-75">

                <div class="absolute inset-0 flex flex-col justify-center items-center z-10 px-4">
                    <div id="last"
                        class="bg-gray-300/90 backdrop-blur-sm w-full max-w-xl p-6 rounded-2xl shadow-xl flex flex-col gap-4">

                        <h1 class="text-center font-bold text-2xl text-gray-800">Manage Tasks</h1>

                        <div class="flex gap-2 w-full">
                            <input id="taskInput" type="text" placeholder="Add Task..."
                                class="flex-1 px-4 py-2 border border-green-600 rounded-lg bg-white text-black outline-none focus:ring-2 focus:ring-green-400" />
                            <button id="addbtn"
                                class="px-6 py-2 bg-green-600 text-white font-bold rounded-lg hover:bg-green-700 transition-colors cursor-pointer ">
                                Add Task
                            </button>
                        </div>
                        <!-- Dynamic Tasks List Container -->
                        <div id="taskList" class="mt-2 space-y-2 max-h-48 overflow-y-auto pr-1">
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </header>

    <script src="script.js"></script>
</body>

</html>
